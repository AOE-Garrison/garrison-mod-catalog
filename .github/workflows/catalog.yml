name: Build mod catalog
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['mods/**', 'scripts/**', '.github/workflows/catalog.yml']
permissions:
  contents: write
concurrency:
  group: catalog-publish
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate packages and build index
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_catalog.py --private --repository "$CATALOG_REPOSITORY" --ref "$(git rev-parse HEAD)"
      - name: Publish validated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated mod catalog'
            git push origin HEAD:main
          fi
