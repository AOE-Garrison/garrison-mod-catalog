name = "Modding Showcase"
version = "0.1.0"
summary = "Meet Shrek and ten Wizard Sheep, then build the Cow House on Dry Arabia."
author = "overbait"
updated = "2026-09-29"
min_garrison = "0.1.0"
content_types = ["game-mode", "tuning-pack"]
description = """
A playable collection of custom characters and building art. At the centre of the map you receive Shrek, ten Wizard Sheep, a scout and a special builder. Select the builder, open the first-age build menu and use House to construct the Cow House. Shrek has manual movement, combat and a dance ability; the scenario does not issue automatic combat or dance orders.

Your normal civilisation start is retained, with eight extra villagers, five spearmen, 600 food, 200 wood and 250 gold. With one human player, you control both the starting settlement and the centre group.

How to launch
1. Enable Modding Showcase in Garrison and press Play.
2. Create a solo custom match with one human and an AI.
3. Map: ordinary Dry Arabia.
4. Game Mode: Modding Showcase.
5. Tuning Pack: Modding Showcase Tuning.
6. Start the match and look at the centre of the map after a few seconds.

This bundle provides a Game Mode and Tuning Pack; do not choose a Crafted map. Enabling it in Garrison does not select these lobby fields. Use only this showcase bundle for the test. Town-centre recruitment of showcase units is not included. Multiplayer is not supported.
"""
changelog = """
0.1.0 / 2026-09-29
First catalog release of the complete Modding Showcase. Updated distribution for the shared Garrison Player, with a current bundle manifest, Game Mode + Tuning card labels, launch instructions and a Blender-rendered cover. The complete scene was accepted in a solo match with the current Garrison on 2026-09-29. The previously accepted scenario and cooked models are preserved; no separate showcase DLL or launcher is included.
"""
