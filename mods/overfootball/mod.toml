description = "How to launch\n1. Enable OverFootball in Garrison and press Play.\n2. Open a custom lobby.\n3. Map (Crafted): OverFootball map.\n4. Tuning Pack: OverFootball tuning.\n5. Keep the regular game mode; no extra Game Mode is needed.\nControls: select a footballer; R toggles ball follow, T cheers. The follow checkbox remains available. Q/W/E retain their previous actions.\n\nEnabling the bundle does not select its map or tuning in the lobby."
changelog = "0.8.2 / 2026-09-29\nFixed malformed line endings in the tuning localization table, which prevented its names and tooltips from loading. Gameplay, camera behavior, art and audio are unchanged. Select OverFootball map together with OverFootball tuning; Ram Napkin Race tuning is not compatible with the football map."
